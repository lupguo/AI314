name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI 中没有 tclaude/agy，verify-dist 会自动跳过两端 plugin validate
      - run: make check CLAUDE_BIN=__none__ AGY_BIN=__none__
